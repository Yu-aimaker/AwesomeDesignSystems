<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AwesomeDS — Responsive QA</title><style>body{margin:20px;background:#e4e4e7;color:#18181b;font:14px system-ui}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:16px}select,button{font:inherit;padding:12px;border:1px solid #aaa;background:white}iframe{border:1px solid #aaa;background:white;display:block;height:844px;max-width:none}output{font-family:monospace}</style><header><label>検証幅 <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1024</option><option>1440</option></select></label><label>ページ <select id="page"><option value="overview">概要</option><option value="foundations">基本要素</option><option value="components">コンポーネント</option><option value="knowledge">Knowledge</option><option value="skills">Skills</option></select></label><button id="measure">再計測</button><output id="result" aria-live="polite">読み込み中</output></header><iframe title="実際のページを指定幅で表示" id="frame" src="./#overview" width="390"></iframe><script>
const frame=document.getElementById('frame'),result=document.getElementById('result');
function measure(){const d=frame.contentDocument;if(!d?.querySelector('main'))return;const width=frame.contentWindow.innerWidth,scroll=d.documentElement.scrollWidth;result.textContent=`viewport: ${width}px / document: ${scroll}px / ${scroll<=width?'横はみ出しなし':'横はみ出しあり'}`;}
document.getElementById('width').onchange=e=>{frame.width=e.target.value;requestAnimationFrame(measure)};document.getElementById('page').onchange=e=>{frame.src='./#'+e.target.value;setTimeout(measure,300)};document.getElementById('measure').onclick=measure;frame.onload=()=>setTimeout(measure,600);
</script></html>
